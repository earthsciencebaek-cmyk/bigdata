<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 데이터 수집 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; margin: 0; min-height: 100vh; background-color: #E8F0FF; color: #000; }
        .sidebar { width: 250px; background-color: #fff; padding: 20px; border-right: 5px solid #000; flex-shrink: 0; }
        .sidebar h2 { border-bottom: 4px solid #000; padding-bottom: 10px; font-weight: 900; }
        .category-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: #fff; border: 3px solid #000; cursor: pointer; font-weight: bold; box-shadow: 4px 4px 0px #000; transition:0.1s;}
        .category-btn.active { background: #FFDE00; transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-x: hidden;}
        #dashboardTitle { font-size: 28px; background: #118AB2; color:#fff; padding: 15px; border: 5px solid #000; box-shadow: 6px 6px 0px #000; text-align: center; margin-top:0;}
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .line-chart-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 15px; border: 4px solid #000; box-shadow: 6px 6px 0px #000; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #000; padding-bottom: 5px; font-size: 16px;}
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>측정 그룹</h2>
        <button class="category-btn active" onclick="changeGroup('전체')">🌍 전체 보기</button>
        <button class="category-btn" onclick="changeGroup('1모둠')">1모둠</button>
        <button class="category-btn" onclick="changeGroup('2모둠')">2모둠</button>
        <button class="category-btn" onclick="changeGroup('3모둠')">3모둠</button>
        <button class="category-btn" onclick="changeGroup('4모둠')">4모둠</button>
        <button class="category-btn" onclick="changeGroup('5모둠')">5모둠</button>
        <button class="category-btn" onclick="changeGroup('6모둠')">6모둠</button>
    </div>

    <div class="main-content">
        <h1 id="dashboardTitle">전체 모둠 측정 결과</h1>
        
        <div class="grid-container">
            <div class="card">
                <h3>🏃 가속도 비교 (m/s²)</h3>
                <canvas id="accelChart"></canvas>
            </div>
            <div class="card">
                <h3>📐 위치별 경사도 (°)</h3>
                <canvas id="inclChart"></canvas>
            </div>
        </div>

        <div class="line-chart-container">
            <div class="card">
                <h3>🔊 소음 추이 (dB)</h3>
                <canvas id="noiseChart"></canvas>
            </div>
            <div class="card">
                <h3>💡 조도 추이 (lux)</h3>
                <canvas id="illuChart"></canvas>
            </div>
            <div class="card">
                <h3>🌡️ 기압 추이 (Pa)</h3>
                <canvas id="pressChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZM_sBasnOkf4V-In0YkHbMn5pY29ptoauCqrchZvptUFxue89RPFSU4_gDzFsfdU/exec';
        let currentGroup = '전체';
        let rawData = [];
        let accelChart, inclChart, noiseChart, illuChart, pressChart;

        const timeLabels = ['0초','10초','20초','30초','40초','50초','60초','70초','80초','90초'];
        const groupColors = { '1모둠':'#EF476F', '2모둠':'#FFD166', '3모둠':'#06D6A0', '4모둠':'#118AB2', '5모둠':'#073B4C', '6모둠':'#9D4EDD' };

        function initCharts() {
            Chart.defaults.font.weight = 'bold';
            Chart.defaults.color = '#000';
            
            accelChart = new Chart(document.getElementById('accelChart'), { type: 'bar', data: { labels: ['정지', '걷기', '점프'], datasets: [{ label: '가속도', backgroundColor: '#EF476F', borderColor: '#000', borderWidth: 2, data: [] }] }});
            inclChart = new Chart(document.getElementById('inclChart'), { type: 'bar', data: { labels: ['위치1', '위치2', '위치3'], datasets: [{ label: '경사도(°)', backgroundColor: '#06D6A0', borderColor: '#000', borderWidth: 2, data: [] }] }});

            const lineOptions = { responsive: true, scales: { x: { grid: {color: '#000'} } } };
            noiseChart = new Chart(document.getElementById('noiseChart'), { type: 'line', data: { labels: timeLabels, datasets: [] }, options: lineOptions });
            illuChart = new Chart(document.getElementById('illuChart'), { type: 'line', data: { labels: timeLabels, datasets: [] }, options: lineOptions });
            pressChart = new Chart(document.getElementById('pressChart'), { type: 'line', data: { labels: timeLabels, datasets: [] }, options: lineOptions });
        }

        function changeGroup(group) {
            currentGroup = group;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(group)) btn.classList.add('active');
            });
            document.getElementById('dashboardTitle').innerText = group === '전체' ? '전체 모둠 측정 결과' : `${group} 측정 결과`;
            updateDashboard();
        }

        function updateDashboard() {
            // 중복 제출 시 가장 최신 데이터만 반영하도록 필터링
            const latestData = {};
            rawData.forEach(row => { latestData[row['모둠']] = row; });
            let filtered = Object.values(latestData);
            
            if(currentGroup !== '전체') filtered = filtered.filter(d => d['모둠'] === currentGroup);
            if(filtered.length === 0) return;

            // 1. 막대 그래프 업데이트
            const a_rest = filtered.reduce((s, d) => s + Number(d['가속도(정지)']||0), 0) / filtered.length;
            const a_walk = filtered.reduce((s, d) => s + Number(d['가속도(걷기)']||0), 0) / filtered.length;
            const a_jump = filtered.reduce((s, d) => s + Number(d['가속도(점프)']||0), 0) / filtered.length;
            accelChart.data.datasets[0].data = [a_rest, a_walk, a_jump]; accelChart.update();

            const i_val1 = filtered.reduce((s, d) => s + Number(d['위치1(각도)']||0), 0) / filtered.length;
            const i_val2 = filtered.reduce((s, d) => s + Number(d['위치2(각도)']||0), 0) / filtered.length;
            const i_val3 = filtered.reduce((s, d) => s + Number(d['위치3(각도)']||0), 0) / filtered.length;
            inclChart.data.datasets[0].data = [i_val1, i_val2, i_val3];
            inclChart.data.labels = currentGroup !== '전체' ? [filtered[0]['위치1(이름)'], filtered[0]['위치2(이름)'], filtered[0]['위치3(이름)']] : ['위치1', '위치2', '위치3'];
            inclChart.update();

            // 2. 꺾은선 그래프(시계열) 업데이트
            const groupsToPlot = currentGroup === '전체' ? [...new Set(filtered.map(d => d['모둠']))] : [currentGroup];
            const dsNoise = [], dsIllu = [], dsPress = [];

            groupsToPlot.forEach(grp => {
                const gData = filtered.find(d => d['모둠'] === grp);
                const nData=[], iData=[], pData=[];
                for(let i=0; i<=90; i+=10) {
                    nData.push(gData[`소음_${i}초`]);
                    iData.push(gData[`조도_${i}초`]);
                    pData.push(gData[`기압_${i}초`]);
                }
                const c = groupColors[grp] || '#000';
                const dsTemplate = { label: grp, borderColor: c, backgroundColor: c, borderWidth: 3, tension: 0.1, fill: false };
                
                dsNoise.push({ ...dsTemplate, data: nData });
                dsIllu.push({ ...dsTemplate, data: iData });
                dsPress.push({ ...dsTemplate, data: pData });
            });

            noiseChart.data.datasets = dsNoise; noiseChart.update();
            illuChart.data.datasets = dsIllu; illuChart.update();
            pressChart.data.datasets = dsPress; pressChart.update();
        }

        async function fetchData() {
            try {
                const res = await fetch(WEB_APP_URL);
                rawData = await res.json();
                updateDashboard();
            } catch(e) { console.error(e); }
        }

        initCharts(); fetchData(); setInterval(fetchData, 5000);
    </script>
</body>
</html>
