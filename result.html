<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1차시: 생활 주변 데이터 측정</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #DFE5F2; color: #000; padding: 20px; display: flex; justify-content: center; align-items: center; margin: 0; }
        .form-container { background-color: #ffffff; width: 100%; max-width: 550px; padding: 30px; border: 5px solid #000; box-shadow: 8px 8px 0px #000; }
        h2 { text-align: center; font-size: 24px; font-weight: 900; background-color: #FFDE00; padding: 15px; border: 4px solid #000; box-shadow: 4px 4px 0px #000; margin-top: 0; margin-bottom: 25px; }
        .section-title { background-color: #06D6A0; display: inline-block; padding: 5px 10px; font-weight: bold; border: 3px solid #000; margin-top: 25px; margin-bottom: 10px; }
        label { display: block; font-weight: 900; font-size: 14px; margin-bottom: 5px; margin-top: 10px; }
        .input-group { display: flex; gap: 10px; }
        input, select { width: 100%; padding: 10px; font-size: 15px; font-weight: bold; border: 3px solid #000; box-sizing: border-box; background-color: #fff; transition: 0.1s; }
        input:focus, select:focus { outline: none; background-color: #E8F0FF; box-shadow: 3px 3px 0px #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; }
        th, td { border: 2px solid #000; padding: 5px; }
        th { background-color: #FFDE00; font-size: 13px; }
        td input { padding: 8px; font-size: 13px; }
        button { width: 100%; padding: 18px; margin-top: 30px; background-color: #EF476F; color: #fff; border: 4px solid #000; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 6px 6px 0px #000; }
        button:active { transform: translate(6px, 6px); box-shadow: 0px 0px 0px #000; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>📊 데이터 수집 기록장</h2>
        <form id="dataForm">
            <label>👥 모둠 선택</label>
            <select id="group" required>
                <option value="1모둠">1모둠</option><option value="2모둠">2모둠</option>
                <option value="3모둠">3모둠</option><option value="4모둠">4모둠</option>
                <option value="5모둠">5모둠</option><option value="6모둠">6모둠</option>
            </select>

            <div class="section-title">🏃 가속도계 (m/s²)</div>
            <label>정지 상태</label><input type="number" id="accel_rest" step="any" required>
            <label>걷기 상태</label><input type="number" id="accel_walk" step="any" required>
            <label>점프 상태</label><input type="number" id="accel_jump" step="any" required>

            <div class="section-title">📐 경사계 (도 °)</div>
            <div class="input-group">
                <input type="text" id="incl_name1" placeholder="위치1 이름" required>
                <input type="number" id="incl_val1" placeholder="각도" step="any" required>
            </div>
            <div class="input-group" style="margin-top:10px;">
                <input type="text" id="incl_name2" placeholder="위치2 이름" required>
                <input type="number" id="incl_val2" placeholder="각도" step="any" required>
            </div>
            <div class="input-group" style="margin-top:10px;">
                <input type="text" id="incl_name3" placeholder="위치3 이름" required>
                <input type="number" id="incl_val3" placeholder="각도" step="any" required>
            </div>

            <div class="section-title">🌍 환경 변인 (90초간 10초 간격)</div>
            <table>
                <thead>
                    <tr><th>시간</th><th>소음(dB)</th><th>조도(lux)</th><th>기압(Pa)</th></tr>
                </thead>
                <tbody id="timeSeriesBody">
                    <!-- JS로 자동 생성됨 -->
                </tbody>
            </table>

            <button type="submit">🚀 데이터 전송하기</button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZM_sBasnOkf4V-In0YkHbMn5pY29ptoauCqrchZvptUFxue89RPFSU4_gDzFsfdU/exec';

        // 0~90초 입력창 자동 생성
        const tbody = document.getElementById('timeSeriesBody');
        for(let i=0; i<=90; i+=10) {
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight:bold;">${i}초</td>
                    <td><input type="number" id="noise_${i}" step="any" required></td>
                    <td><input type="number" id="illu_${i}" step="any" required></td>
                    <td><input type="number" id="press_${i}" step="any" required></td>
                </tr>
            `;
        }

        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.querySelector('button');
            submitBtn.innerHTML = '전송 중... ⏳'; submitBtn.disabled = true;
            
            const noiseArr = [], illuArr = [], pressArr = [];
            for(let i=0; i<=90; i+=10) {
                noiseArr.push(document.getElementById(`noise_${i}`).value);
                illuArr.push(document.getElementById(`illu_${i}`).value);
                pressArr.push(document.getElementById(`press_${i}`).value);
            }

            const data = {
                group: document.getElementById('group').value,
                accel_rest: document.getElementById('accel_rest').value, accel_walk: document.getElementById('accel_walk').value, accel_jump: document.getElementById('accel_jump').value,
                incl_name1: document.getElementById('incl_name1').value, incl_val1: document.getElementById('incl_val1').value,
                incl_name2: document.getElementById('incl_name2').value, incl_val2: document.getElementById('incl_val2').value,
                incl_name3: document.getElementById('incl_name3').value, incl_val3: document.getElementById('incl_val3').value,
                noise: noiseArr, illuminance: illuArr, pressure: pressArr
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(() => {
                alert('전송 완료!'); document.getElementById('dataForm').reset();
            })
            .catch(() => alert('오류 발생'))
            .finally(() => { submitBtn.innerHTML = '🚀 데이터 전송하기'; submitBtn.disabled = false; });
        });
    </script>
</body>
</html>
